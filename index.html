
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f3ef">
<title>MY LITTLE JOURNAL</title>
<style>
:root{
  --bg:#f8f5f1;--card:#fffdfb;--pink:#ead2d0;
  --pink2:#f4e6e3;--brown:#705b55;--text:#514541;
  --muted:#a99b95;--green:#e8eee5;--line:#eee5df;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
header{padding:25px 20px 16px}
header small{color:var(--muted);letter-spacing:2px}
h1{font-size:23px;letter-spacing:2px;margin:7px 0}
main{padding:0 15px 95px;max-width:680px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fffdfbf2;
  border-top:1px solid var(--line);display:flex;justify-content:space-around;
  padding:9px 2px calc(9px + env(safe-area-inset-bottom));z-index:5}
nav button{border:0;background:none;color:var(--muted);font-size:11px;padding:5px}
nav button.active{color:var(--brown);font-weight:700}
nav span{display:block;font-size:19px;margin-bottom:3px}
.page{display:none}.page.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:16px;margin:12px 0;box-shadow:0 3px 12px #80685b08}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--pink2);border-radius:15px;padding:14px}
.stat small{color:var(--muted)}
.stat strong{display:block;font-size:21px;margin-top:7px}
h2{font-size:18px;margin:18px 3px 10px}
h3{font-size:15px;margin:0 0 8px}
p{line-height:1.6}
small,.muted{color:var(--muted)}
button,.btn{border:0;border-radius:12px;background:var(--pink2);
  color:var(--brown);padding:10px 13px;font-size:13px;cursor:pointer}
button.primary{background:var(--brown);color:white}
button.danger{background:#f7e7e5;color:#a35f58}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);
  border-radius:11px;background:#fffdfb;color:var(--text);font-size:14px;
  margin:5px 0 11px}
textarea{min-height:75px;resize:vertical}
label{font-size:12px;color:var(--muted)}
form{margin-top:10px}
.quads{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quad{min-height:125px;border-radius:17px;padding:15px;text-align:left;
  display:flex;flex-direction:column;justify-content:space-between}
.quad strong{font-size:15px}.quad small{color:#806f68}
.q1{background:#f1e1de}.q2{background:#e9eee5}
.q3{background:#f3eadc}.q4{background:#e8e5ef}
.item{display:flex;gap:12px;align-items:center}
.item img{width:68px;height:68px;object-fit:cover;border-radius:12px}
.item .info{flex:1;min-width:0}
.item .info strong{display:block}
.pill{font-size:11px;background:var(--pink2);padding:4px 8px;border-radius:20px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.actions button{padding:7px 10px}
hr{border:0;border-top:1px solid var(--line);margin:13px 0}
.empty{text-align:center;padding:25px;color:var(--muted)}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <small>MY LITTLE JOURNAL · MY DAILY LIFE</small>
  <h1>我的生活手帳 ♡</h1>
  <div class="muted" id="today"></div>
</header>

<main>
<section class="page active" id="home">
  <div class="card">
    <div class="row between"><h3>本月總覽</h3><input id="homeMonth" type="month" style="width:145px;margin:0"></div>
    <div class="grid" style="margin-top:13px">
      <div class="stat"><small>收入</small><strong id="homeIncome">$0</strong></div>
      <div class="stat"><small>支出</small><strong id="homeExpense">$0</strong></div>
      <div class="stat"><small>可用餘額</small><strong id="homeBalance">$0</strong></div>
      <div class="stat"><small>本月預算</small><strong id="homeBudget">$0</strong></div>
    </div>
  </div>
  <h2>最近記帳</h2>
  <div class="card" id="recentRecords"></div>
  <h2>我的小提醒</h2>
  <div class="card" id="homeReminders">目前沒有提醒 ♡</div>
</section>

<section class="page" id="records">
  <h2>記帳小本本</h2>
  <div class="card">
    <form id="recordForm">
      <label>收支類型</label>
      <select id="recordType"><option value="expense">支出</option><option value="income">收入</option></select>
      <label>金額（可輸入 20+38）</label>
      <input id="recordAmount" placeholder="例如：20+38" required>
      <label>分類</label>
      <input id="recordCategory" placeholder="例如：飲食、交通、薪水" required>
      <label>日期</label>
      <input id="recordDate" type="date" required>
      <label>備註</label>
      <textarea id="recordNote" placeholder="寫點什麼吧…"></textarea>
      <button class="primary" type="submit" style="width:100%">儲存紀錄</button>
    </form>
  </div>
  <h2>所有紀錄</h2>
  <div class="card" id="recordList"></div>
</section>

<section class="page" id="funds">
  <h2>我的基金</h2>
  <div class="card">
    <form id="fundForm">
      <label>基金名稱</label><input id="fundName" placeholder="例如：旅行基金" required>
      <label>目標金額</label><input id="fundTarget" type="number" min="1" placeholder="10000" required>
      <button class="primary" style="width:100%">新增基金</button>
    </form>
  </div>
  <div id="fundList"></div>
</section>

<section class="page" id="stats">
  <h2>收支統計</h2>
  <div class="card">
    <label>選擇月份</label>
    <input id="statsMonth" type="month">
    <div class="grid">
      <div class="stat"><small>收入</small><strong id="statsIncome">$0</strong></div>
      <div class="stat"><small>支出</small><strong id="statsExpense">$0</strong></div>
    </div>
    <hr>
    <h3>支出分類</h3>
    <div id="categoryStats"></div>
  </div>
</section>

<section class="page" id="shopping">
  <h2>購物管理 ♡</h2>
  <p class="muted">先選擇象限，再進入清單查看商品照片。</p>
  <div class="quads">
    <button class="quad q1" onclick="openQuadrant('wantUrgent')">
      <strong>♡ 想要＋急需</strong><small>願望清單</small>
    </button>
    <button class="quad q2" onclick="openQuadrant('needUrgent')">
      <strong>✿ 需要＋急需</strong><small>急需購物</small>
    </button>
    <button class="quad q3" onclick="openQuadrant('wantLater')">
      <strong>☆ 想要＋非急需</strong><small>想買但先存下</small>
    </button>
    <button class="quad q4" onclick="openQuadrant('needLater')">
      <strong>☁ 需要＋非急需</strong><small>非急需購物</small>
    </button>
  </div>
  <div class="card">
    <h3>購物小統計</h3>
    <div id="shoppingStats"></div>
  </div>
  <div id="quadrantDetail" class="hidden">
    <div class="row between">
      <h2 id="quadrantTitle">商品清單</h2>
      <button onclick="closeQuadrant()">返回四象限</button>
    </div>
    <div class="card">
      <form id="itemForm">
        <label>商品名稱</label><input id="itemName" required placeholder="想買什麼呢？">
        <label>預估金額</label><input id="itemPrice" placeholder="例如：299">
        <label>商品照片（可選）</label><input id="itemPhoto" type="file" accept="image/*">
        <label>備註</label><textarea id="itemNote" placeholder="尺寸、顏色、購買連結等"></textarea>
        <label>冷靜期</label>
        <select id="itemCooldown">
          <option value="0">不設定</option><option value="7">7 天</option>
          <option value="14">14 天</option><option value="30">30 天</option>
        </select>
        <button class="primary" style="width:100%">新增商品</button>
      </form>
    </div>
    <div id="itemList"></div>
  </div>
</section>

<section class="page" id="settings">
  <h2>設定</h2>
  <div class="card">
    <h3>每月預算</h3>
    <input id="budgetInput" type="number" min="0" placeholder="設定每月預算">
    <button class="primary" onclick="saveBudget()">儲存預算</button>
  </div>
  <div class="card">
    <h3>資料備份</h3>
    <p class="muted">將紀錄、基金、購物清單和設定匯出成 JSON 檔案。</p>
    <button class="primary" onclick="backup()">匯出備份</button>
    <hr>
    <label>還原備份檔案</label>
    <input type="file" id="restoreFile" accept=".json,application/json">
    <button onclick="restoreBackup()">還原資料</button>
  </div>
  <div class="card">
    <h3>資料儲存說明</h3>
    <p class="muted">目前使用此瀏覽器的本機儲存。清除網站資料或更換裝置前，請先匯出備份。</p>
  </div>
</section>
</main>

<nav>
  <button class="active" data-page="home"><span>⌂</span>首頁</button>
  <button data-page="records"><span>▤</span>記帳</button>
  <button data-page="funds"><span>♡</span>基金</button>
  <button data-page="stats"><span>◷</span>統計</button>
  <button data-page="shopping"><span>✿</span>購物</button>
  <button data-page="settings"><span>⚙</span>設定</button>
</nav>

<script>
const KEY="myLittleJournal_v2";
const defaults={
  records:[],funds:[],items:[],bought:[],budget:5000
};
let data;
try{
  data={...defaults,...JSON.parse(localStorage.getItem(KEY)||"{}")};
}catch(e){data={...defaults};}
let currentQuadrant="wantUrgent";

const $=id=>document.getElementById(id);
const money=n=>"$"+Number(n||0).toLocaleString("zh-TW");
const today=()=>new Date().toISOString().slice(0,10);
const monthNow=()=>today().slice(0,7);
const dateText=d=>d?d.slice(2).replaceAll("-","/"):"";
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(data));}
  catch(e){alert("儲存空間可能不足，請先備份資料或減少照片。");}
}
function calc(v){
  const s=String(v).replace(/\s/g,"");
  if(!s||!/^[0-9+\-*/().]+$/.test(s))throw Error("金額格式錯誤");
  const tokens=s.match(/\d*\.?\d+|[()+\-*/]/g);
  if(!tokens||tokens.join("")!==s)throw Error("金額格式錯誤");
  let i=0;
  function factor(){
    let t=tokens[i++];
    if(t==="("){let n=expr();if(tokens[i++]!==")")throw Error();return n;}
    if(t==="-")return-factor();
    if(t==="+")return factor();
    let n=Number(t);if(!Number.isFinite(n))throw Error();return n;
  }
  function term(){
    let n=factor();
    while(tokens[i]==="*"||tokens[i]==="/"){
      let op=tokens[i++],b=factor();
      if(op==="/"&&b===0)throw Error("不能除以 0");
      n=op==="*"?n*b:n/b;
    }return n;
  }
  function expr(){
    let n=term();
    while(tokens[i]==="+"||tokens[i]==="-"){
      let op=tokens[i++],b=term();n=op==="+"?n+b:n-b;
    }return n;
  }
  let result=expr();if(i!==tokens.length||!Number.isFinite(result))throw Error("算式錯誤");
  return Math.round(result*100)/100;
}
function showPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.id===id));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===id));
  render();
}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>showPage(b.dataset.page)));
$("today").textContent=dateText(today());
$("recordDate").value=today();
$("homeMonth").value=monthNow();
$("statsMonth").value=monthNow();

$("recordForm").addEventListener("submit",e=>{
  e.preventDefault();
  try{
    const amount=calc($("recordAmount").value);
    if(amount<=0)throw Error("金額必須大於 0");
    data.records.unshift({
      id:crypto.randomUUID(),type:$("recordType").value,amount,
      category:$("recordCategory").value.trim(),date:$("recordDate").value,
      note:$("recordNote").value.trim()
    });
    save();e.target.reset();$("recordDate").value=today();render();
    alert("紀錄已儲存 ♡");
  }catch(err){alert(err.message||"請檢查金額算式");}
});

$("fundForm").addEventListener("submit",e=>{
  e.preventDefault();
  const name=$("fundName").value.trim(),target=Number($("fundTarget").value);
  if(!name||target<=0)return alert("請輸入正確資料");
  data.funds.push({id:crypto.randomUUID(),name,target,balance:0,history:[]});
  save();e.target.reset();render();
});
function fundAction(id,action){
  const f=data.funds.find(x=>x.id===id);if(!f)return;
  const raw=prompt(action==="deposit"?"存入金額":"提領金額");
  if(raw===null)return;
  let amount;try{amount=calc(raw);}catch(e){return alert("金額格式錯誤");}
  if(amount<=0)return alert("金額必須大於 0");
  if(action==="withdraw"&&amount>f.balance)return alert("基金餘額不足");
  f.balance+=action==="deposit"?amount:-amount;
  f.history.push({action,amount,date:today()});
  save();render();
}
function deleteRecord(id){
  if(!confirm("確定刪除這筆紀錄？"))return;
  data.records=data.records.filter(x=>x.id!==id);save();render();
}
function renderRecords(){
  const list=$("recordList");
  if(!data.records.length){list.innerHTML='<div class="empty">還沒有記帳紀錄 ♡</div>';return;}
  list.innerHTML=data.records.map(r=>`
    <div class="row between">
      <div><strong>${esc(r.category)}</strong><br><small>${dateText(r.date)} · ${esc(r.note||"無備註")}</small></div>
      <div style="text-align:right"><strong>${r.type==="income"?"+":"−"}${money(r.amount)}</strong>
      <br><button class="danger" onclick="deleteRecord('${r.id}')">刪除</button></div>
    </div><hr>`).join("");
}
function renderFunds(){
  $("fundList").innerHTML=data.funds.length?data.funds.map(f=>`
    <div class="card">
      <div class="row between"><h3>${esc(f.name)}</h3><span class="pill">${Math.min(100,Math.round(f.balance/f.target*100))}%</span></div>
      <p>${money(f.balance)} / ${money(f.target)}</p>
      <div style="height:8px;background:#eee;border-radius:10px;overflow:hidden">
        <div style="height:100%;width:${Math.min(100,f.balance/f.target*100)}%;background:#c99e98"></div>
      </div>
      <div class="actions">
        <button onclick="fundAction('${f.id}','deposit')">存入</button>
        <button onclick="fundAction('${f.id}','withdraw')">提領</button>
        <button class="danger" onclick="deleteFund('${f.id}')">刪除基金</button>
      </div>
    </div>`).join(""):'<div class="card empty">還沒有基金</div>';
}
function deleteFund(id){
  if(!confirm("確定刪除此基金？"))return;
  data.funds=data.funds.filter(f=>f.id!==id);save();render();
}
function selectedMonth(){return $("homeMonth").value||monthNow();}
function monthRecords(m){return data.records.filter(r=>r.date.startsWith(m));}
function renderHome(){
  const rs=monthRecords(selectedMonth());
  const income=rs.filter(r=>r.type==="income").reduce((s,r)=>s+r.amount,0);
  const expense=rs.filter(r=>r.type==="expense").reduce((s,r)=>s+r.amount,0);
  $("homeIncome").textContent=money(income);
  $("homeExpense").textContent=money(expense);
  $("homeBalance").textContent=money(income-expense);
  $("homeBudget").textContent=money(data.budget);
  const recent=data.records.slice(0,5);
  $("recentRecords").innerHTML=recent.length?recent.map(r=>
    `<div class="row between"><span>${esc(r.category)} <small>${dateText(r.date)}</small></span><strong>${r.type==="income"?"+":"−"}${money(r.amount)}</strong></div><hr>`
  ).join(""):'<div class="empty">還沒有紀錄</div>';
  const due=data.items.filter(i=>i.cooldownDate&&i.cooldownDate<=today());
  $("homeReminders").textContent=due.length?`有 ${due.length} 件商品冷靜期已到，可以重新考慮囉。`:"目前沒有到期的冷靜期提醒 ♡";
}
function renderStats(){
  const m=$("statsMonth").value||monthNow(),rs=monthRecords(m);
  const inc=rs.filter(r=>r.type==="income").reduce((s,r)=>s+r.amount,0);
  const exp=rs.filter(r=>r.type==="expense").reduce((s,r)=>s+r.amount,0);
  $("statsIncome").textContent=money(inc);$("statsExpense").textContent=money(exp);
  const cats={};
  rs.filter(r=>r.type==="expense").forEach(r=>cats[r.category]=(cats[r.category]||0)+r.amount);
  const entries=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  $("categoryStats").innerHTML=entries.length?entries.map(([k,v])=>
    `<div class="row between"><span>${esc(k)}</span><strong>${money(v)}</strong></div><hr>`
  ).join(""):'<div class="empty">這個月還沒有支出</div>';
}
const qNames={
  wantUrgent:"想要＋急需｜願望清單",
  needUrgent:"需要＋急需｜急需購物",
  wantLater:"想要＋非急需｜想買但先存下",
  needLater:"需要＋非急需｜非急需購物"
};
function openQuadrant(q){
  currentQuadrant=q;$("quadrantTitle").textContent=qNames[q];
  $("quadrantDetail").classList.remove("hidden");renderItems();
  $("quadrantDetail").scrollIntoView({behavior:"smooth"});
}
function closeQuadrant(){$("quadrantDetail").classList.add("hidden");}
$("itemForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const file=$("itemPhoto").files[0];
  let photo="";
  if(file){
    if(file.size>5*1024*1024)return alert("照片請選擇 5MB 以下的檔案");
    photo=await resizeImage(file);
  }
  const cooldown=Number($("itemCooldown").value);
  const d=new Date();d.setDate(d.getDate()+cooldown);
  data.items.push({
    id:crypto.randomUUID(),quadrant:currentQuadrant,
    name:$("itemName").value.trim(),price:Number($("itemPrice").value)||0,
    note:$("itemNote").value.trim(),photo,
    created:today(),cooldownDate:cooldown?d.toISOString().slice(0,10):""
  });
  save();e.target.reset();renderItems();renderShoppingStats();
});
function resizeImage(file){
  return new Promise(resolve=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const scale=Math.min(1,900/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=img.width*scale;c.height=img.height*scale;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);resolve(c.toDataURL("image/jpeg",.75));
    };img.src=url;
  });
}
function renderItems(){
  const items=data.items.filter(i=>i.quadrant===currentQuadrant);
  $("itemList").innerHTML=items.length?items.map(i=>`
    <div class="card">
      <div class="item">
        ${i.photo?`<img src="${i.photo}" alt="商品照片">`:'<div style="width:68px;height:68px;border-radius:12px;background:#f4e6e3;display:grid;place-items:center">♡</div>'}
        <div class="info"><strong>${esc(i.name)}</strong><div>${money(i.price)}</div>
        <small>${i.cooldownDate?"冷靜期至 "+dateText(i.cooldownDate):"未設定冷靜期"}</small></div>
      </div>
      ${i.note?`<p class="muted">${esc(i.note)}</p>`:""}
      <div class="actions">
        <button onclick="moveItem('${i.id}')">移動象限</button>
        <button onclick="buyItem('${i.id}')">已購買</button>
        <button class="danger" onclick="removeItem('${i.id}')">刪除</button>
      </div>
    </div>`).join(""):'<div class="card empty">這裡還沒有商品，新增一件吧 ♡</div>';
}
function moveItem(id){
  const options=Object.entries(qNames).map(([k,v],n)=>`${n+1}. ${v}`).join("\n");
  const n=prompt("輸入要移動到的象限編號：\n"+options);
  if(n===null)return;
  const keys=Object.keys(qNames),q=keys[Number(n)-1];
  if(!q)return alert("請輸入 1～4");
  const item=data.items.find(i=>i.id===id);if(item)item.quadrant=q;
  save();renderItems();renderShoppingStats();
}
function buyItem(id){
  const i=data.items.find(x=>x.id===id);if(!i)return;
  const raw=prompt("實際購買金額：",String(i.price));
  if(raw===null)return;
  let actual;try{actual=calc(raw);}catch(e){return alert("金額格式錯誤");}
  if(actual<0)return alert("金額不能小於 0");
  data.bought.push({...i,actualPrice:actual,boughtDate:today()});
  data.items=data.items.filter(x=>x.id!==id);
  save();renderItems();renderShoppingStats();
  alert("已移至購買紀錄。若要列入支出，請另外新增一筆記帳。");
}
function removeItem(id){
  if(!confirm("確定刪除商品？"))return;
  data.items=data.items.filter(i=>i.id!==id);save();renderItems();renderShoppingStats();
}
function renderShoppingStats(){
  const total=data.items.reduce((s,i)=>s+i.price,0);
  const bought=data.bought.reduce((s,i)=>s+i.actualPrice,0);
  $("shoppingStats").innerHTML=`目前待買 ${data.items.length} 件 · 預估 ${money(total)}<br>已購買 ${data.bought.length} 件 · 實際 ${money(bought)}`;
}
function saveBudget(){
  data.budget=Math.max(0,Number($("budgetInput").value)||0);save();render();
  alert("預算已儲存 ♡");
}
function backup(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="my-little-journal-backup.json";a.click();
  URL.revokeObjectURL(url);
}
async function restoreBackup(){
  const file=$("restoreFile").files[0];if(!file)return alert("請先選擇備份檔案");
  if(!confirm("還原會覆蓋目前資料，確定繼續嗎？"))return;
  try{
    const d=JSON.parse(await file.text());
    if(!Array.isArray(d.records)||!Array.isArray(d.items)||!Array.isArray(d.funds))throw Error();
    data={...defaults,...d};save();render();alert("備份還原完成 ♡");
  }catch(e){alert("檔案格式不正確，無法還原。");}
}
function esc(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function render(){
  $("budgetInput").value=data.budget;
  renderHome();renderRecords();renderFunds();renderStats();renderShoppingStats();
  if(!$("quadrantDetail").classList.contains("hidden"))renderItems();
}
$("homeMonth").addEventListener("change",renderHome);
$("statsMonth").addEventListener("change",renderStats);
render();
</script>
</body>
</html>
