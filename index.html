<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MY LITTLE JOURNAL</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --bg:#f7f5f1;
  --paper:#fffefa;
  --ink:#514d49;
  --muted:#9b958d;
  --line:#eee9e1;
  --accent:#c99e9c;
  --soft:#f4e9e7;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
  padding-bottom:90px;
}
.app{max-width:760px;margin:auto;padding:20px 16px}
.top{display:flex;justify-content:space-between;margin-bottom:20px}
.brand{font-size:12px;letter-spacing:2px;font-weight:bold}
.page{display:none}
.page.active{display:block}
h1{font-size:25px}
h2{font-size:18px}
.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin:12px 0;
}
.hero{
  background:linear-gradient(135deg,var(--soft),var(--paper));
  padding:22px;
  border-radius:22px;
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:15px;
  padding:14px;
}
.stat strong{display:block;font-size:21px;margin-top:6px}
.sub{font-size:12px;color:var(--muted)}
.btn{
  border:0;border-radius:12px;
  background:var(--accent);
  color:white;padding:10px 14px;
}
.btn.secondary{background:var(--soft);color:var(--ink)}
.field{
  width:100%;padding:11px;
  border:1px solid var(--line);
  border-radius:12px;background:white;
}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 6px}
.row{display:flex;align-items:center;gap:9px}
.between{justify-content:space-between}
.grow{flex:1}
.list{display:flex;flex-direction:column;gap:8px}
.item{
  display:flex;align-items:center;gap:10px;
  background:white;border:1px solid var(--line);
  padding:11px;border-radius:13px;
}
.nav{
  position:fixed;bottom:0;left:0;right:0;
  background:#fffefaed;border-top:1px solid var(--line);
  padding:8px 5px calc(8px + env(safe-area-inset-bottom));
}
.navinner{
  max-width:760px;margin:auto;
  display:grid;grid-template-columns:repeat(5,1fr);
}
.nav button{
  border:0;background:transparent;color:var(--muted);
  font-size:11px;padding:7px;
}
.nav button b{display:block;font-size:20px}
.nav button.active{background:var(--soft);border-radius:12px;color:var(--ink)}
.quads{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.quad{padding:13px;border-radius:15px;min-height:110px;background:#f8eeea}
.quad:nth-child(2){background:#f5f1e5}
.quad:nth-child(3){background:#edf2ed}
.quad:nth-child(4){background:#efedf4}
.progress{height:8px;background:#eee;border-radius:20px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:var(--accent)}
.themegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.theme{border:1px solid var(--line);border-radius:12px;padding:10px;background:white}
.hidden{display:none!important}
.modalback{
  display:none;position:fixed;inset:0;background:#0005;
  align-items:flex-end;z-index:20;
}
.modalback.show{display:flex}
.modal{
  width:100%;max-width:760px;margin:auto;
  background:var(--paper);border-radius:22px 22px 0 0;
  padding:20px;max-height:85vh;overflow:auto;
}
</style>
</head>
<body>
<div class="app">
<div class="top">
  <div class="brand">MY LITTLE JOURNAL ✦</div>
  <div class="sub" id="date"></div>
</div>

<!-- 首頁 -->
<section class="page active" id="home">
  <div class="hero">
    <div class="sub" id="homeDate"></div>
    <h1>把日子，慢慢收進口袋 ♡</h1>
    <div class="sub">今天也留一點時間給自己。</div>
  </div>
  <div class="grid2">
    <div class="stat"><small>本月收入</small><strong id="income">$0</strong></div>
    <div class="stat"><small>本月支出</small><strong id="expense">$0</strong></div>
    <div class="stat"><small>預算剩餘</small><strong id="remaining">$0</strong></div>
    <div class="stat"><small>目標存款</small><strong id="fundTotal">$0</strong></div>
  </div>
  <div class="card">
    <div class="row between">
      <h2>今天的小事</h2>
      <button class="btn secondary" onclick="addTask()">＋新增</button>
    </div>
    <div id="tasks" class="list"></div>
  </div>
  <div class="card">
    <h2>今日隨手記</h2>
    <textarea id="dailyNote" class="field" rows="3" placeholder="今天有什麼想記下來的？"></textarea>
    <button class="btn" style="margin-top:10px" onclick="saveNote()">儲存</button>
  </div>
</section>

<!-- 記帳 -->
<section class="page" id="ledger">
  <h1>記帳</h1>
  <div class="sub">每一筆收支，都清楚整理。</div>
  <div class="row" style="margin:15px 0">
    <button class="btn secondary" onclick="setType('expense')">支出</button>
    <button class="btn secondary" onclick="setType('income')">收入</button>
  </div>
  <div class="card">
    <h2 id="recordTitle">新增支出</h2>
    <label>金額（支援算式）</label>
    <input id="amount" class="field" placeholder="例如 20+38*2">
    <div class="row" style="margin-top:8px;flex-wrap:wrap">
      <button class="btn secondary" onclick="appendOp('+')">＋</button>
      <button class="btn secondary" onclick="appendOp('-')">－</button>
      <button class="btn secondary" onclick="appendOp('*')">×</button>
      <button class="btn secondary" onclick="appendOp('/')">÷</button>
      <button class="btn secondary" onclick="calculate()">＝</button>
    </div>
    <div id="preview" class="sub"></div>
    <label>分類</label>
    <select id="category" class="field">
      <option>餐飲</option><option>交通</option>
      <option>生活用品</option><option>購物</option>
      <option>娛樂</option><option>學習</option>
      <option>其他</option>
    </select>
    <label>使用哪個預算</label>
    <select id="source" class="field"></select>
    <label>日期</label>
    <input id="recordDate" type="date" class="field">
    <label>備註</label>
    <input id="memo" class="field">
    <button class="btn" style="width:100%;margin-top:15px" onclick="addRecord()">儲存紀錄</button>
  </div>
  <div class="card">
    <h2>近期紀錄</h2>
    <div id="records" class="list"></div>
  </div>
</section>

<!-- 購物 -->
<section class="page" id="shopping">
  <h1>購物管理</h1>
  <div class="sub">先放進清單，想清楚再決定。</div>
  <button class="btn" style="margin:15px 0" onclick="addShop()">＋新增商品</button>
  <div class="quads">
    <div class="quad"><h3>♡ 想要且需要</h3><div id="q0"></div></div>
    <div class="quad"><h3>✦ 需要但不急</h3><div id="q1"></div></div>
    <div class="quad"><h3>☁ 想要但可等等</h3><div id="q2"></div></div>
    <div class="quad"><h3>… 暫時不買</h3><div id="q3"></div></div>
  </div>
  <div class="card"><h2>全部商品</h2><div id="shops" class="list"></div></div>
</section>

<!-- 目標 -->
<section class="page" id="goals">
  <h1>目標與基金</h1>
  <div class="card">
    <div class="row between">
      <h2>我的基金</h2>
      <button class="btn" onclick="addGoal()">＋新增</button>
    </div>
    <div id="goalsList" class="list"></div>
  </div>
</section>

<!-- 我的 -->
<section class="page" id="me">
  <h1>我的小天地</h1>
  <div class="card">
    <h2>主題色</h2>
    <div class="themegrid" id="themes"></div>
  </div>
  <div class="card">
    <h2>裝飾元素</h2>
    <label><input type="checkbox" id="decor" checked onchange="toggleDecor()"> 顯示裝飾</label>
  </div>
  <div class="card">
    <h2>預算分配</h2>
    <div id="budgetSettings"></div>
    <button class="btn secondary" onclick="addBudget()">＋新增分類</button>
    <button class="btn" onclick="saveBudgets()">儲存預算</button>
  </div>
  <div class="card">
    <h2>資料備份</h2>
    <button class="btn secondary" onclick="backup()">匯出完整備份</button>
    <label class="btn secondary">匯入備份<input type="file" hidden onchange="restore(event)"></label>
  </div>
</section>
</div>

<nav class="nav">
<div class="navinner">
<button class="active" data-page="home" onclick="go('home',this)"><b>⌂</b>首頁</button>
<button data-page="ledger" onclick="go('ledger',this)"><b>＋</b>記帳</button>
<button data-page="shopping" onclick="go('shopping',this)"><b>♡</b>購物</button>
<button data-page="goals" onclick="go('goals',this)"><b>☆</b>目標</button>
<button data-page="me" onclick="go('me',this)"><b>☷</b>我的</button>
</div>
</nav>

<script>
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
const money=n=>'$'+Number(n||0).toLocaleString('zh-TW');
let data={
 records:[],
 budgets:[
  {name:'生活費',amount:3000},
  {name:'娛樂費',amount:1000},
  {name:'購物',amount:1000},
  {name:'儲蓄',amount:2000}
 ],
 goals:[
  {id:1,name:'隱眼基金',target:2000,balance:0},
  {id:2,name:'彼安諾基金',target:3000,balance:0}
 ],
 shops:[],tasks:[],notes:{},theme:'奶油灰',decor:true,type:'expense'
};
let db;
function openDB(){
 return new Promise(resolve=>{
  let r=indexedDB.open('MLJ',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('data');
  r.onsuccess=()=>resolve(r.result);
  r.onerror=()=>resolve(null);
 });
}
async function init(){
 db=await openDB();
 if(db){
  let tx=db.transaction('data');
  let r=tx.objectStore('data').get('main');
  r.onsuccess=()=>{if(r.result)data={...data,...r.result};render()};
  r.onerror=()=>render();
 }else render();
}
function save(){
 if(!db)return;
 let tx=db.transaction('data','readwrite');
 tx.objectStore('data').put(data,'main');
}
function go(id,btn){
 document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
 $(id).classList.add('active');
 document.querySelectorAll('[data-page]').forEach(x=>x.classList.remove('active'));
 btn.classList.add('active');
 window.scrollTo(0,0);
}
function setType(type){
 data.type=type;
 $('recordTitle').textContent=type==='expense'?'新增支出':'新增收入';
}
function parseMath(s){
 try{
  let t=s.replace(/\s/g,''),i=0;
  const number=()=>{
   let st=i;
   while(i<t.length&&/[0-9.]/.test(t[i]))i++;
   let v=t.slice(st,i);
   if(!v||v.split('.').length>2)throw 0;
   return Number(v);
  };
  const factor=()=>{
   if(t[i]==='+'){i++;return factor()}
   if(t[i]==='-'){i++;return-factor()}
   if(t[i]==='('){i++;let v=add();if(t[i++]!==')')throw 0;return v}
   return number();
  };
  const mul=()=>{
   let v=factor();
   while(t[i]==='*'||t[i]==='/'){
    let op=t[i++],b=factor();
    if(op==='/'&&b===0)throw 0;
    v=op==='*'?v*b:v/b;
   }
   return v;
  };
  const add=()=>{
   let v=mul();
   while(t[i]==='+'||t[i]==='-'){
    let op=t[i++],b=mul();
    v=op==='+'?v+b:v-b;
   }
   return v;
  };
  let v=add();
  return i===t.length&&Number.isFinite(v)?Math.round(v*100)/100:null;
 }catch{return null}
}
function appendOp(op){$('amount').value+=op;calculate()}
function calculate(){
 let v=parseMath($('amount').value);
 $('preview').textContent=v===null?'請輸入完整算式':'＝ '+money(v);
 return v;
}
function addRecord(){
 let amount=calculate();
 if(amount===null||amount<=0)return alert('請輸入正確金額');
 data.records.unshift({
  id:Date.now(),type:data.type,amount,
  category:$('category').value,
  source:$('source').value,
  date:$('recordDate').value||today(),
  memo:$('memo').value
 });
 $('amount').value='';$('memo').value='';
 save();render();
}
function addTask(){
 let name=prompt('今天想完成什麼？');
 if(name){data.tasks.push({id:Date.now(),name,done:false});save();render()}
}
function saveNote(){data.notes[today()]=$('dailyNote').value;save();alert('已儲存')}
function addShop(){
 let name=prompt('商品名稱？');if(!name)return;
 let price=Number(prompt('商品價格？')||0);
 let q=Number(prompt('放入哪個象限？\n0 想要且需要\n1 需要但不急\n2 想要但可等等\n3 暫時不買')||0);
 data.shops.push({id:Date.now(),name,price,quad:Math.max(0,Math.min(3,q))});
 save();render();
}
function addGoal(){
 let name=prompt('基金名稱？');if(!name)return;
 let target=Number(prompt('目標金額？')||0);
 data.goals.push({id:Date.now(),name,target,balance:0});
 save();render();
}
function deposit(id){
 let g=data.goals.find(x=>x.id===id);
 let n=Number(prompt('存入金額？')||0);
 if(n>0){g.balance+=n;save();render()}
}
function withdraw(id){
 let g=data.goals.find(x=>x.id===id);
 let n=Number(prompt('提領金額？')||0);
 if(n>0&&n<=g.balance){g.balance-=n;save();render()}
}
function addBudget(){
 data.budgets.push({name:'新分類',amount:0});renderBudget();
}
function renderBudget(){
 $('budgetSettings').innerHTML=data.budgets.map((b,i)=>`
 <div class="item">
 <input class="field" data-name="${i}" value="${b.name}">
 <input class="field" type="number" data-amount="${i}" value="${b.amount}">
 </div>`).join('');
}
function saveBudgets(){
 document.querySelectorAll('[data-name]').forEach(x=>data.budgets[+x.dataset.name].name=x.value);
 document.querySelectorAll('[data-amount]').forEach(x=>data.budgets[+x.dataset.amount].amount=Math.max(0,+x.value||0));
 save();render();alert('預算已儲存');
}
function toggleDecor(){
 data.decor=$('decor').checked;
 document.querySelectorAll('.deco').forEach(x=>x.classList.toggle('hidden',!data.decor));
 save();
}
const themeList=[
 ['奶油灰','#f7f5f1','#c4b8ab','#eee9e1'],
 ['奶油粉','#fbf2f1','#d6a8a6','#f4e3e2'],
 ['薰衣草紫','#f5f2fa','#b6a8cf','#eae4f4'],
 ['雲朵汽水','#f1f7f8','#9dbdc5','#e2eff1'],
 ['奶油布丁','#faf6eb','#c9ae75','#f1e8ce'],
 ['薄荷兔兔','#f1f6f1','#9eb9a4','#e3eee4'],
 ['摩卡可可','#f4f0eb','#a98c78','#e9ded4'],
 ['櫻桃派對','#fbf2f2','#c77d84','#f3e1e3'],
 ['蜜桃烏龍','#faf3ed','#d6a58d','#f2e4d8'],
 ['櫻花日記','#faf3f7','#cda6bd','#f1e4ed'],
 ['海鹽奶蓋','#f2f5f5','#9caeb0','#e4ebeb'],
 ['午夜星空','#30333d','#b5a9d2','#454957']
];
function setTheme(name){
 let t=themeList.find(x=>x[0]===name);
 data.theme=name;
 document.documentElement.style.setProperty('--bg',t[1]);
 document.documentElement.style.setProperty('--accent',t[2]);
 document.documentElement.style.setProperty('--soft',t[3]);
 save();renderThemes();
}
function renderThemes(){
 $('themes').innerHTML=themeList.map(t=>`
 <button class="theme" onclick="setTheme('${t[0]}')">
 <div style="height:22px;border-radius:8px;background:${t[1]};border:2px solid ${t[2]}"></div>
 ${t[0]} ${data.theme===t[0]?'✓':''}
 </button>`).join('');
}
function backup(){
 let a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
 a.download='my-little-journal-backup.json';a.click();
 URL.revokeObjectURL(a.href);
}
function restore(e){
 let f=e.target.files[0];if(!f)return;
 let r=new FileReader();
 r.onload=()=>{
  try{data={...data,...JSON.parse(r.result)};save();render();alert('備份匯入成功')}
  catch{alert('檔案格式錯誤')}
 };
 r.readAsText(f);
}
function render(){
 let month=today().slice(0,7);
 let records=data.records.filter(x=>x.date.startsWith(month));
 let income=records.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0);
 let expense=records.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);
 $('income').textContent=money(income);
 $('expense').textContent=money(expense);
 $('remaining').textContent=money(data.budgets.reduce((s,b)=>s+b.amount,0)-expense);
 $('fundTotal').textContent=money(data.goals.reduce((s,g)=>s+g.balance,0));
 $('records').innerHTML=data.records.map(r=>`
 <div class="item"><div class="grow"><b>${r.category}</b><div class="sub">${r.date} ${r.memo||''}</div></div>
 <b>${r.type==='expense'?'-':'+'}${money(r.amount)}</b></div>`).join('')||'<div class="sub">尚無紀錄</div>';
 $('source').innerHTML=data.budgets.filter(x=>x.amount>0).map(x=>`<option>${x.name}</option>`).join('');
 $('shops').innerHTML=data.shops.map(s=>`<div class="item"><div class="grow"><b>${s.name}</b><div class="sub">${money(s.price)}</div></div></div>`).join('')||'<div class="sub">尚無商品</div>';
 for(let i=0;i<4;i++){
  $('q'+i).innerHTML=data.shops.filter(s=>s.quad===i).map(s=>`<div class="sub">${s.name} · ${money(s.price)}</div>`).join('')||'<div class="sub">尚無商品</div>';
 }
 $('goalsList').innerHTML=data.goals.map(g=>`
 <div class="item"><div class="grow"><b>${g.name}</b>
 <div class="sub">${money(g.balance)} / ${money(g.target)} · ${g.target?Math.round(g.balance/g.target*100):0}%</div>
 <div class="progress"><i style="width:${Math.min(100,g.target?g.balance/g.target*100:0)}%"></i></div>
 ${g.balance>=g.target?'<div class="sub">已達成！超額存款也會保留。</div>':''}
 </div><div><button class="btn" onclick="deposit(${g.id})">存入</button>
 <button class="btn secondary" onclick="withdraw(${g.id})">提領</button></div></div>`).join('');
 $('tasks').innerHTML=data.tasks.map(t=>`
 <label class="item"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${t.id})">${t.name}</label>`).join('')||'<div class="sub">今天還沒有待辦。</div>';
 $('dailyNote').value=data.notes[today()]||'';
 $('recordDate').value=today();
 renderBudget();renderThemes();
}
function toggleTask(id){
 let t=data.tasks.find(x=>x.id===id);t.done=!t.done;save();render();
}
$('date').textContent=new Date().toLocaleDateString('zh-TW');
$('homeDate').textContent=new Date().toLocaleDateString('zh-TW');
init();
</script>
</body>
</html>
